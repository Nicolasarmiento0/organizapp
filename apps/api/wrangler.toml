name = "organiza-app-api"
main = "src/index.ts"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Base de datos SQLite en el Edge (Cloudflare D1 - Tier 100% Gratuito)
# Ejecuta `npx wrangler d1 create organiza-app-db` y reemplaza database_id
[[d1_databases]]
binding = "DB"
database_name = "organiza-app-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
TRUSTED_ORIGINS = "organizaapp://,exp://,http://localhost:8081"
# IMPORTANTE: No guardes secretos en wrangler.toml.
# En local usa `.dev.vars` con BETTER_AUTH_SECRET="..."
# En producción ejecuta: `npx wrangler secret put BETTER_AUTH_SECRET`
