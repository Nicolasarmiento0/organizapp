name = "organizapp"
main = "src/index.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "../mobile/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Base de datos SQLite en el Edge (Cloudflare D1 - Tier 100% Gratuito)
[[d1_databases]]
binding = "DB"
database_name = "organiza-app-db"
database_id = "23d464f7-9bb5-43b5-9455-4b9a23ae5085"
migrations_dir = "drizzle"

# Almacenamiento de imágenes comprimidas WebP (Cloudflare R2 - Tier Gratuito $0)
# Habilita R2 en el Cloudflare Dashboard y crea el bucket antes de descomentar:
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "organiza-app-media"

[vars]
BETTER_AUTH_URL = "https://organizapp.nsarmiento.workers.dev"
TRUSTED_ORIGINS = "https://organizapp.nsarmiento.workers.dev,organizaapp://,exp://,http://localhost:8081,http://localhost:8082"
VAPID_PUBLIC_KEY = "BFeX7Rq98tUMA6KRYm2yCLdW7HW7PXLe0Lvt0UFg0AhY5FqnD75Xb11axYVh8AzgjHhHvTfOs6OShAK_GKae1tA"
VAPID_SUBJECT = "https://organizapp.nsarmiento.workers.dev"
# IMPORTANTE: No guardes secretos en wrangler.toml.
# En local usa `.dev.vars` con BETTER_AUTH_SECRET="..."
# En producción ejecuta: `npx wrangler secret put BETTER_AUTH_SECRET`

[triggers]
crons = ["* * * * *"]
